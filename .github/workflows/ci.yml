name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run blocks:model
      - run: git diff --exit-code -- blocks/data/schemas
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
